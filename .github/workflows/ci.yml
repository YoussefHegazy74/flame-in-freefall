name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit, contract, and reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend and scripts
        run: python -m compileall -q backend src scripts

      - name: Run data-free backend tests
        run: python -m pytest -m "not integration" -q

      - name: Audit Python dependencies
        run: |
          python -m pip install --quiet pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Verify committed scientific artifacts
        run: bash scripts/verify_reproducibility.sh

  frontend:
    name: Frontend lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  quality-gate:
    name: Release quality gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Confirm required jobs passed
        run: |
          echo "Backend and frontend quality gates passed."
          echo "Full-data integration, Playwright, axe, and live-model checks are separate jobs."
